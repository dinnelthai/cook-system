name: Node Tests

on:
  push:
    branches: [main, master, "feat/pump-full-replay-v1.3", "feat/pumpswap-full-replay-v1.4", "feat/pumpswap-boost-buy-burn-v1.4"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned reference SDK and Solana client
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test

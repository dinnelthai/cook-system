name: Node Tests

on:
  push:
    branches: [main, master, "feat/pump-full-replay-v1.3", "feat/pumpswap-full-replay-v1.4", "feat/pumpswap-boost-buy-burn-v1.4"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: Node ${{ matrix.node-version }} unified acceptance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install pinned reference SDK and Solana client
        run: npm ci --no-audit --no-fund
      - name: Run unified code acceptance
        run: npm run accept:all
      - name: Upload machine-readable acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cook-system-unified-acceptance-node-${{ matrix.node-version }}
          path: .cook-system/acceptance/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

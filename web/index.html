<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cook System · Market Terminal</title>
<style>
:root{color-scheme:dark;--bg:#080e18;--surface:#101a29;--surface2:#0c1522;--line:#253449;--text:#e6eefb;--muted:#92a6c0;--cyan:#55d6f4;--green:#42dfb1;--red:#ff8293;--amber:#f5c875;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-feature-settings:"tnum"}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 80% 0%,#14294155,transparent 55%),linear-gradient(90deg,#29466b0d 1px,transparent 1px),linear-gradient(#29466b0d 1px,transparent 1px);background-size:auto,44px 44px,44px 44px;z-index:-1}header{height:68px;padding:0 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b1320;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;border:1px solid #3587a8;background:linear-gradient(140deg,#174663,#10273c);clip-path:polygon(18% 0,100% 0,100% 82%,82% 100%,0 100%,0 18%);display:grid;place-items:center;color:var(--cyan);font:700 18px var(--mono)}h1{font-size:16px;letter-spacing:.14em;margin:0;font-weight:800}.brand-sub{font:10px var(--mono);letter-spacing:.1em;color:var(--muted);margin-top:3px}.header-meta{display:flex;align-items:center;gap:14px}.build{font:10px var(--mono);color:var(--muted);letter-spacing:.1em}.tag{display:flex;align-items:center;gap:8px;color:var(--amber);border:1px solid #695432;background:#292218;border-radius:5px;padding:7px 11px;font:11px var(--mono);letter-spacing:.035em}.tag:before{content:"";width:7px;height:7px;background:var(--amber);border-radius:50%;box-shadow:0 0 8px #f5c87566}.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 68px)}nav{padding:24px 12px;border-right:1px solid var(--line);background:#0b1320;position:sticky;top:68px;align-self:start;height:calc(100vh - 68px);overflow:auto}nav::before{content:"WORKSPACE / 工作区";display:block;color:#7489a4;font:10px var(--mono);letter-spacing:.1em;margin:0 10px 16px}nav button{display:flex;align-items:center;gap:10px;width:10 ;border:1px solid #344b63;border-radius:5px;padding:9px 12px;background:#0a1422;color:var(--text);min-width:0}input:not([type=checkbox]),textarea,select{width:100%}input[type=file]{font-size:11px;color:#a6b7cc}input[type=file]::file-selector-button{border:1px solid #3a536d;background:#172b40;color:#cee3f4;border-radius:4px;padding:6px 10px;margin-right:10px;cursor:pointer}button{cursor:pointer;transition:background .14s,border-color .14s,color .14s}button:hover:not(:disabled){border-color:#4383a3;background:#182d42}button.primary{background:#64def4;color:#071522;border-color:#64def4;font-weight:700}button.primary:hover:not(:disabled){background:#91e8fa}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}textarea{min-height:96px;resize:vertical}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}td,th{padding:10px 9px;border-bottom:1px solid #24344a}th{color:#8ea7c2;font-weight:550;font-size:11px;background:#0c1625;text-transform:uppercase;letter-spacing:.045em}td{font-size:12px}td:last-child{font-family:var(--mono)}tbody tr:hover{background:#17273c}tbody tr:last-child td{border-bottom:0}.scroll{overflow:auto;border:1px solid #24344a;border-radius:5px}.positive{color:var(--green)}.negative{color:var(--red)}.notice{padding:10px 13px;border:1px solid #6a55354d;border-left:3px solid var(--amber);border-radius:5px;background:#2b241c7a;color:#e3cba2;margin-bottom:16px;font-size:12px;line-height:1.6}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.7 var(--mono);color:#a8c9e2;background:#09121d;padding:14px;border:1px solid var(--line);border-radius:5px;max-height:480px;overflow:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.preview{max-width:120px;max-height:120px;border-radius:8px;margin-top:10px}.foot{font:10px var(--mono);color:var(--muted);margin-top:18px;letter-spacing:.025em}svg{width:100%;height:170px}
main[data-page=dashboard]{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}main[data-page=dashboard]>.eyebrow{grid-column:1/-1;margin:0}main[data-page=dashboard]>h2{grid-column:1/-1;margin:0}main[data-page=dashboard]>.notice{grid-column:1/-1;margin:0}main[data-page=dashboard]>.panel{margin:0}main[data-page=dashboard]>.panel:nth-of-type(1){grid-column:1/-1;grid-row:6}main[data-page=dashboard]>.panel:nth-of-type(2){grid-column:1;grid-row:4}main[data-page=dashboard]>.panel:nth-of-type(3){grid-column:2;grid-row:4}main[data-page=dashboard]>.panel:nth-of-type(4){grid-column:1/-1;grid-row:5}main[data-page=dashboard]>.panel:nth-of-type(2) .stats,main[data-page=dashboard]>.panel:nth-of-type(3) .stats{grid-template-columns:repeat(2,minmax(0,1fr))}main[data-page=dashboard]>.panel:nth-of-type(2) .stat:nth-child(odd) strong{color:var(--green)}main[data-page=dashboard]>.panel:nth-of-type(2) .stat:nth-child(even) strong{color:var(--red)}main[data-page=dashboard]>.panel:nth-of-type(3) .stat strong{color:#b7e8fb}main[data-page=dashboard]>.foot{grid-column:1/-1;margin:0}
@media(max-width:1100px){.layout{grid-template-columns:180px minmax(0,1fr)}main{padding:20px}main[data-page=dashboard]{display:block}main[data-page=dashboard]>*{margin-bottom:14px!important}main[data-page=dashboard]>.panel:nth-of-type(1){display:none}main[data-page=dashboard]>.panel:nth-of-type(1){display:block}}
@media(max-width:700px){header{height:auto;min-height:62px;padding:12px 14px}.build{display:none}.brand-sub{font-size:9px}.tag{font-size:9px;padding:6px}.layout{display:block}nav{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav::before{display:none}nav button{white-space:nowrap;width:auto;margin:0 4px 0 0;padding:8px}.nav-num{display:none}main{padding:14px}.grid{grid-template-columns:1fr}.stat strong{font-size:17px}.panel{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Dense terminal layout; preserve existing responsive behavior. */
body::before{display:none}header{height:54px;padding:0 18px}.layout{grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 54px)}nav{top:54px;height:calc(100vh - 54px);padding:14px 9px}nav button{padding:9px 8px;margin-bottom:3px;font-size:12px}nav button.active{background:#142e39;border-color:#28536b}main{padding:18px}h2{font-size:21px;margin-bottom:10px}.panel{background:var(--surface);border-radius:5px;padding:12px;box-shadow:none;margin-bottom:12px}.stat{background:var(--surface2);padding:10px;border-radius:4px}.stat:after{display:none}.stat strong{font-size:19px;margin-top:5px}h3{margin-bottom:10px}.stats{gap:8px}td,th{padding:7px 9px}.subnav{margin-bottom:12px}.subnav button{font-size:11px;padding:5px 9px}.notice{margin-bottom:12px}.foot{margin-top:12px}
@media(max-width:1100px){.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:14px}}
